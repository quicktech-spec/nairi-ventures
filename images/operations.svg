<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="opsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E8A7A" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#24316B" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="#F7F5EF"/>
  <rect width="800" height="600" fill="url(#opsGrad)"/>

  <!-- Tri-Country Operational Coordinates -->
  <g stroke="#171512" stroke-width="1.2" stroke-opacity="0.2">
    <circle cx="260" cy="240" r="110" fill="none" stroke-dasharray="4,4"/>
    <circle cx="540" cy="240" r="110" fill="none" stroke-dasharray="4,4"/>
    <circle cx="400" cy="400" r="110" fill="none" stroke-dasharray="4,4"/>
  </g>

  <!-- Connection Lines between Hubs -->
  <line x1="260" y1="240" x2="540" y2="240" stroke="#1E8A7A" stroke-width="2.5"/>
  <line x1="540" y1="240" x2="400" y2="400" stroke="#E4A63A" stroke-width="2.5"/>
  <line x1="400" y1="400" x2="260" y2="240" stroke="#24316B" stroke-width="2.5"/>

  <!-- Hub Nodes -->
  <!-- Hub 1: Singapore / APAC -->
  <circle cx="260" cy="240" r="16" fill="#24316B"/>
  <circle cx="260" cy="240" r="28" fill="none" stroke="#24316B" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="260" y="200" text-anchor="middle" font-family="'General Sans', sans-serif" font-size="13" font-weight="600" fill="#171512">JURISDICTION 01</text>
  <text x="260" y="285" text-anchor="middle" font-family="'General Sans', sans-serif" font-size="12" fill="#797368">Legal &amp; Banking Core</text>

  <!-- Hub 2: London / EMEA -->
  <circle cx="540" cy="240" r="16" fill="#1E8A7A"/>
  <circle cx="540" cy="240" r="28" fill="none" stroke="#1E8A7A" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="540" y="200" text-anchor="middle" font-family="'General Sans', sans-serif" font-size="13" font-weight="600" fill="#171512">JURISDICTION 02</text>
  <text x="540" y="285" text-anchor="middle" font-family="'General Sans', sans-serif" font-size="12" fill="#797368">Production &amp; Supply Chain</text>

  <!-- Hub 3: US / Global -->
  <circle cx="400" cy="400" r="16" fill="#E4A63A"/>
  <circle cx="400" cy="400" r="28" fill="none" stroke="#E4A63A" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="400" y="445" text-anchor="middle" font-family="'General Sans', sans-serif" font-size="13" font-weight="600" fill="#171512">JURISDICTION 03</text>
  <text x="400" y="465" text-anchor="middle" font-family="'General Sans', sans-serif" font-size="12" fill="#797368">Global Software &amp; Capital</text>

  <!-- Central Studio Core Matrix -->
  <rect x="340" y="280" width="120" height="48" rx="24" fill="#171512"/>
  <text x="400" y="310" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-size="14" font-style="italic" fill="#F7F5EF">Nairi Hub</text>

  <!-- Operational Flow Indicators -->
  <g stroke="#171512" stroke-width="1" stroke-opacity="0.2">
    <line x1="80" y1="520" x2="720" y2="520"/>
  </g>
  <text x="400" y="550" text-anchor="middle" font-family="'General Sans', sans-serif" font-size="13" fill="#4A463F">Integrated Compliance, Incorporation, and Cross-Border Systems</text>
</svg>
