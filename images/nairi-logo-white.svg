    <circle cx="21" cy="13.5" r="1.75" fill="#F7C86A"/>
  </g>

  <!-- Wordmark Light -->
  <g transform="translate(54, 32)">
    <text font-family="'Fraunces', Georgia, serif" font-size="20" font-weight="700" letter-spacing="0.04em" fill="#FFFFFF">
