      <stop offset="0%" stop-color="#F7C86A" />
      <stop offset="50%" stop-color="#E4A63A" />
      <stop offset="100%" stop-color="#C2821E" />
    </linearGradient>
    <linearGradient id="nairiDarkD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E222D" />
      <stop offset="100%" stop-color="#0E1017" />
